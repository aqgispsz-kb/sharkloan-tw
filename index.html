<!DOCTYPE html>
<html lang="zh-TW">
<head>

<style>
body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
}

/* ===== Header ===== */
header {
    background: #0a2540;
    color: white;
    padding: 20px;
    text-align: center;
}

.logo-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
}

.logo {
    width: 70px;
}

/* ===== 橘色流光背景 ===== */
.hero, .section {
    background: linear-gradient(270deg, #ff9a00, #ffb347, #ffd27f, #ff9a00);
    background-size: 400% 400%;
    animation: bgFlow 8s ease infinite;
}

@keyframes bgFlow {
    0% {background-position: 0% 50%;}
    50% {background-position: 100% 50%;}
    100% {background-position: 0% 50%;}
}

/* ===== HERO ===== */
.hero {
    padding: 90px 20px;
}

.hero-inner {
    max-width: 1100px;
    margin: auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

/* ===== 按鈕（黑金升級版） ===== */
.line-btn {
    display: inline-block;
    background: linear-gradient(120deg, #000000, #1a1a1a, #c9a74d, #000000);
    background-size: 300%;
    color: #f5d27a;
    padding: 18px 36px;   /* 變大 */
    border-radius: 10px;
    text-decoration: none;
    font-weight: bold;
    font-size: 18px;      /* 字體變大 */
    margin-top: 30px;     /* 與上方距離 */
    margin-bottom: 20px;  /* 🔥 與下方拉開 */
    animation: btnGoldFlow 4s linear infinite;
    transition: 0.3s;
    letter-spacing: 1px;
}

@keyframes btnGoldFlow {
    0% {background-position: 0%;}
    100% {background-position: 200%;}
}

.line-btn:hover {
    transform: scale(1.08);
    box-shadow: 0 0 25px rgba(255,215,100,0.7);
}

/* ===== 聊天動畫 ===== */
.chat-demo {
    width: 320px;
}

.chat-bubble {
    padding: 12px 16px;
    border-radius: 16px;
    margin-bottom: 12px;
    opacity: 0;
    transform: translateY(40px) scale(0.95);
    animation: stackIn 0.6s forwards;
}

.chat-bubble:nth-child(1){animation-delay:0.3s;}
.chat-bubble:nth-child(2){animation-delay:0.8s;}
.chat-bubble:nth-child(3){animation-delay:1.3s;}
.chat-bubble:nth-child(4){animation-delay:1.8s;}

@keyframes stackIn {
    0% {opacity:0; transform:translateY(40px) scale(0.9);}
    60% {opacity:1; transform:translateY(-5px) scale(1.02);}
    100% {opacity:1; transform:translateY(0) scale(1);}
}

.chat-bubble:hover {
    transform: translateY(-6px) scale(1.05);
}

.user { background:#eee; }
.bot { background:#00cfff; color:white; }

/* ===== 新功能區 ===== */
.feature-zone {
    padding: 80px 20px;
    position: relative;
    overflow: hidden;
}

.feature-inner {
    max-width:1100px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:40px;
}

.feature-left h2 {
    font-size:28px;
}

.stats {
    margin:20px 0;
}

.stat {
    margin-bottom:8px;
    font-weight:bold;
}

.feature-right {
    display:flex;
    gap:20px;
}

/* 淺藍卡片（你之前指定） */
.icon-card {
    background: #e6f7ff;
    padding:20px;
    border-radius:12px;
    text-align:center;
    width:100px;
    transition:0.3s;
}

.icon-card:hover {
    transform:translateY(-8px) scale(1.05);
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

/* ===== 鯊魚 ===== */
.shark-section {
    padding:120px 20px;
    background:url('shark-bg.png') right center no-repeat;
    background-size:auto 100%;
}

.shark-content {
    max-width:500px;
    margin-left:5%;
    color:white;
}

/* ===== 卡片 ===== */
.section {
    padding:40px 20px;
}

.card {
    background:rgba(255,255,255,0.9);
    padding:20px;
    margin:15px auto;
    max-width:900px;
    border-radius:10px;
}

/* ===== Footer ===== */
footer {
    background:#0a2540;
    color:white;
    text-align:center;
    padding:20px;
}

/* RWD */
@media (max-width:768px){
    .hero-inner, .feature-inner {
        flex-direction:column;
        text-align:center;
    }
}
</style>
</head>
