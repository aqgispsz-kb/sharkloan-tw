<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鯊速貸</title>

<style>

/* 🔥 只改這裡（整站背景） */
body{
    margin:0;
    font-family:Arial;
    background: linear-gradient(180deg, #f3e4cf 0%, #e9d6bd 50%, #dfc7a7 100%);
}

/* ===== 其他全部不動 ===== */

.container{
    max-width:1100px;
    margin:auto;
}

header{
    background:linear-gradient(180deg,#4fc3f7,#ff9800,#f5e6c8);
    text-align:center;
    padding:40px 20px;
}

.logo{
    width:70px;
}

h1{
    margin:10px 0;
}

.hero{
    background:#ff9800;
    padding:40px 20px;
    text-align:center;
}

.chat{
    max-width:400px;
    margin:auto;
}

.bubble{
    padding:12px;
    border-radius:20px;
    margin:10px 0;
}

.user{ background:#ddd; }
.bot{ background:#1ebbd7;color:#fff; }

.btn{
    display:inline-block;
    margin-top:20px;
    padding:12px 30px;
    color:#fff;
    text-decoration:none;
    border-radius:10px;
    font-weight:bold;
    background:linear-gradient(120deg,#000,#d4af37,#000);
    background-size:200% auto;
    animation:shine 3s linear infinite;
}

@keyframes shine{
    0%{background-position:-200% center;}
    100%{background-position:200% center;}
}

.feature{
    background:#eee;
    padding:40px 20px;
}

.feature-inner{
    display:flex;
    gap:40px;
}

.feature-left{
    flex:1;
}

.feature-right{
    flex:1;
}

.card{
    background:#cfd8dc;
    padding:20px;
    margin:15px 0;
    border-radius:12px;
    text-align:center;
}

.worker{
    position:relative;
    max-width:600px;
    margin:40px auto;
}

.worker-img-wrap img{
    width:100%;
    border-radius:10px;
}

.worker-btn{
    position:absolute;
    top:60%;
    left:10%;
    transform:translateY(-50%);
}

.service{
    background:#ff9800;
    padding:40px 20px;
    text-align:center;
}

.service .item{
    background:#eee;
    margin:15px auto;
    padding:15px;
    max-width:400px;
    border-radius:12px;
}

footer{
    background:#0a2540;
    color:#fff;
    text-align:center;
    padding:20px;
}

/* 📱 手機版（完全不動） */
@media(max-width:768px){

    .feature-inner{
        flex-direction:column;
    }

    .worker{
        aspect-ratio:1/1;
        background:url('worker-bg.jpg') center/cover no-repeat;
    }

    .worker-img-wrap{
        display:none;
    }

    .worker-btn{
        position:absolute;
        top:65%;
        left:8%;
        transform:translateY(-50%);
        z-index:20;
    }

    .btn{
        padding:10px 22px;
        font-size:14px;
    }
}

</style>
</head>

<body>

<header>
    <div class="container">
        <img src="shark-logo.png" class="logo">
        <h1>鯊速貸</h1>
        <p>快速・安全・即時借款服務</p>
    </div>
</header>

<div class="hero">
    <div class="container">
        <h2>1-20萬　當天申請　當天撥款</h2>

        <div class="chat">
            <div class="bubble user">我現在急需資金，可以申請嗎？</div>
            <div class="bubble bot">可以的 👍 最快10分鐘完成審核！</div>
            <div class="bubble user">需要擔保嗎？</div>
            <div class="bubble bot">不需要擔保，流程簡單快速👌</div>
        </div>

        <a href="#" class="btn">立即加入我們</a>
    </div>
</div>

<div class="feature">
    <div class="container feature-inner">

        <div class="feature-left">
            <h2>為什麼選擇鯊速貸？</h2>
            <p>快速、安全、透明，讓借款變簡單</p>
            <p>✔ 3,200+ 成功案例</p>
            <p>✔ 最快10分鐘審核</p>
            <p>✔ 95% 通過率</p>
        </div>

        <div class="feature-right">
            <div class="card">⚡ 快速</div>
            <div class="card">🔒 安全</div>
            <div class="card">💬 回覆</div>
        </div>

    </div>
</div>

<div class="worker">
    <div class="worker-img-wrap">
        <img src="worker-bg.jpg">
    </div>

    <div class="worker-btn">
        <a href="#" class="btn">立即諮詢</a>
    </div>
</div>

<div class="service">
    <div class="container">
        <h2>服務內容</h2>
        <div class="item">💰 小額借款</div>
        <div class="item">⚡ 快速審核</div>
        <div class="item">🔒 資料保護</div>
    </div>
</div>

<footer>
© 2026 鯊速貸
</footer>

</body>
</html>
