<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>鯊速貸 - 快速借款平台</title>

<style>
body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
}

/* ===== Header ===== */
header {
    background: #0a2540;
    color: white;
    padding: 20px;
    text-align: center;
}

.logo-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
}

.logo {
    width: 70px;
}

/* ===== 橘色流光背景 ===== */
.hero, .section {
    background: linear-gradient(270deg, #ff9a00, #ffb347, #ffd27f, #ff9a00);
    background-size: 400% 400%;
    animation: bgFlow 8s ease infinite;
}

@keyframes bgFlow {
    0% {background-position: 0% 50%;}
    50% {background-position: 100% 50%;}
    100% {background-position: 0% 50%;}
}

/* ===== HERO ===== */
.hero {
    padding: 90px 20px;
    position: relative;
}

/* 🔥 強調文字 */
.hero-highlight {
    text-align: center;
    font-size: 20px;
    font-weight: bold;
    color: #fff;
    margin-bottom: 20px;
    letter-spacing: 2px;
}

/* 🔥 原在線人數樣式（保留但不使用） */
.fake-live {
    position: absolute;
    top: 120px;
    left: 10%;
    background: rgba(0,0,0,0.6);
    color: #fff;
    padding: 10px 18px;
    border-radius: 20px;
    font-size: 14px;
}

@media (max-width:768px){
    .fake-live {
        left: 50%;
        transform: translateX(-50%);
        top: 140px;
    }

    .hero-highlight{
        margin-top: 40px;
    }
}

.hero-inner {
    max-width: 1100px;
    margin: auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

/* ===== 按鈕 ===== */
.line-btn {
    display: inline-block;
    background: linear-gradient(90deg, #000, #bfa14a, #000);
    background-size: 200%;
    color: #fff;
    padding: 22px 45px;
    border-radius: 12px;
    text-decoration: none;
    font-weight: bold;
    margin-top: 30px;
    animation: btnFlow 3s linear infinite;
    transition: 0.3s;
    font-size: 20px;
    max-width: 100%;
    box-sizing: border-box;
}

@keyframes btnFlow {
    0% {background-position: 0%;}
    100% {background-position: 200%;}
}

.line-btn:hover {
    transform: scale(1.1);
}

/* ===== 聊天動畫 ===== */
.chat-demo {
    width: 320px;
}

.chat-bubble {
    padding: 12px 16px;
    border-radius: 16px;
    margin-bottom: 12px;
}

.user { background:#eee; }
.bot { background:#00cfff; color:white; }

/* ===== 功能區 ===== */
.feature-zone {
    padding: 80px 20px;
}

.feature-inner {
    max-width:1100px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:40px;
}

.feature-right{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:20px;
}

.icon-card {
    background: #e6f7ff;
    padding:20px;
    border-radius:12px;
    text-align:center;
    width:100px;
}

/* ===== 鯊魚區 ===== */
.shark-section {
    padding:120px 20px;
    background:url('shark-bg.png') right center no-repeat;
    background-size:auto 100%;
}

.shark-content {
    max-width:500px;
    margin-left:5%;
    color:white;
}

/* ===== 服務 ===== */
.section {
    padding:40px 20px;
}

.card {
    background:rgba(255,255,255,0.9);
    padding:20px;
    margin:15px auto;
    max-width:900px;
    border-radius:10px;
}

footer {
    background:#0a2540;
    color:white;
    text-align:center;
    padding:20px;
}
</style>
